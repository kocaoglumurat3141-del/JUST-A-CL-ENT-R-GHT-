
name: Build CART3R CLIENT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source
        run: unzip -q CART3R_CLIENT_SOURCE_v4.zip -d project

      - name: Build CART3R
        run: |
          cd project/CART3R_CLIENT_SOURCE
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CART3R-CLIENT-JAR
          path: project/CART3R_CLIENT_SOURCE/build/libs/*.jar
          
